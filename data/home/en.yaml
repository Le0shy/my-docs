sections: [hero, cards, cta]

hero:
  align: center
  eyebrow: hongyu's writing hub
  title_lines:
    - words: [{ text: Write it down. }]
    - words: [{ text: Find it again. }]
  lead: Essays, a knowledge base on database systems and cloud warehouses, and reviews of the music, films and books I care about.
  actions:
    - { label: Read the blog, url: blog/, icon: fa-solid fa-pen-nib, style: primary }
    - { label: Browse the knowledge base, url: kb/, icon: fa-solid fa-database, style: ghost }

cards:
  eyebrow: Three shelves
  title: What lives here
  columns: 3
  items:
    - title: Blog
      desc: Essays, opinions and short notes on anything.
      icon: fa-solid fa-pen-nib
      url: blog/
    - title: Knowledge Base
      desc: Paper notes, concepts, systems internals and industry history in data management.
      icon: fa-solid fa-database
      url: kb/
    - title: Reviews
      desc: Marks and reviews of music, films and books.
      icon: fa-solid fa-star
      url: reviews/

cta:
  title: Looking for something specific?
  text: Every page is searchable, tagged and cross-linked.
  label: Browse tags
  url: tags/
  style: primary
